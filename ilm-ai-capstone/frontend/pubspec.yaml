name: ilm_ai
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  http: ^1.2.1
  shared_preferences: ^2.2.2
  blur: ^3.1.0
  file_picker: ^11.0.2
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  firebase_core: ^4.7.0
  firebase_vertexai: ^2.2.0
  firebase_ai: ^3.11.0
  firebase_auth: ^6.4.0
  flutter_lucide: ^1.11.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Ikonka yaratish uchun shu paketni qo'shamiz
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - .env

# App ikonkasini o'rnatish uchun sozlamalar:
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21 # Android uchun minimal talab